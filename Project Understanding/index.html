<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Tracker</title>

    <!-- This links our CSS file. Everything visual lives in style.css -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app">
        <h1>My Tasks</h1>

        <!-- The form where the user types a new task -->
        <form id="task-form">
            <input
                type="text"
                id="task-input"
                placeholder="What do you need to do?"
                autocomplete="off"
            >
            <button type="submit">Add</button>
        </form>

        <!-- These buttons let us filter which tasks are shown -->
        <div class="filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="active">Active</button>
            <button class="filter-btn" data-filter="done">Done</button>
        </div>

        <!-- JavaScript will fill this list with <li> items -->
        <ul id="task-list"></ul>

        <!-- A small status line, also updated by JavaScript -->
        <p id="task-count">0 tasks</p>
    </div>

    <!-- This links our JavaScript file. It runs AFTER the HTML above
         has loaded, because of the "defer" attribute. -->
    <script src="script.js" defer></script>
</body>
</html>
