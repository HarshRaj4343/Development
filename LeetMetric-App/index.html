<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeetMetric</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="leetcontainer">
        <div class="heading">
            <h1>LeetMetric</h1>
        </div>
        <div class="userspecific">
            <p>Enter your username below:</p>
            <div class="userinputcontainer">
                <input type="text" placeholder="Enter your Username here" id="leeco">
                <button id="SearchButton">Search</button>
            </div>
        </div>
        <div class="stats">
            <div class="progress">
                <div class="progressitem">
                    <div class="easyprogress circle">
                        <span id="easylabel">
                        </span>
                        Easy
                    </div>
                </div>
                <div class="progressitem">
                    <div class="mediumprogress circle">
                        <span id="mediumlabel">
                        </span>
                        medium
                    </div>
                </div>
                <div class="progressitem">
                    <div class="hardprogress circle">
                        <span id="hardlabel">
                        </span>
                        hard
                    </div>
                </div>
            </div>
            <div class="statscard">
                <!-- populate using js -->
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
