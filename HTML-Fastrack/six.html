<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A simple portfolio homepage.">
    <title>Jordan Lee -- Portfolio</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <h1>Jordan Lee</h1>
        <nav aria-label="Main navigation">
            <a href="#projects">Projects</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>
    <main>
        <section id="about">
            <h2>About Me</h2>
            <p>I’m a front-end developer who loves building
                <strong>accessible</strong> and <em>fast</em> websites.
            </p>
        </section>
        <section id="projects">
            <h2>Projects</h2>
            <article>
                <h3>Weather Dashboard</h3>
                <figure>
                    <img src="weather-app.png" alt="Screenshot of the weather dashboard app">
                    <figcaption>A responsive weather dashboard.</figcaption>
                </figure>
                <p>Built with vanilla JavaScript and a public weather API.</p>
            </article>
        </section>
        <section id="contact">
            <h2>Get in Touch</h2>
            <form action="/submit-message" method="POST">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="4"></textarea>
                <button type="submit">Send Message</button>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Jordan Lee. All rights reserved.</p>
    </footer>
</body>

</html>
